<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#192B38">
  <title>BODAS OS · by LUMEN</title>
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#192B38; }
    #app { display:block; width:100%; height:100vh; height:100dvh; border:0; background:#F5F2EC; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; gap:15px; text-align:center; background:#192B38; color:#F5F2EC; font-family:Arial,sans-serif; z-index:2; pointer-events:none; }
    #loading strong { font-size:clamp(30px,6vw,54px); letter-spacing:.12em; }
    #loading span { color:#B69A79; letter-spacing:.22em; font-size:13px; }
    #loading p { font-size:13px; opacity:.7; }
    #loading.hidden { display:none; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite"><strong>BODAS OS</strong><span>by LUMEN</span><p>Preparando tu espacio de trabajo…</p></div>
  <iframe id="app" title="BODAS OS" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-write" src="https://script.google.com/macros/s/AKfycbxPaHGS7auifhqQrsnFcIGfWsmqGxIkDVzggxdcwo_hqY3P7OlSP_FJtKuXcfZaUSdv5g/exec"></iframe>
  <script>
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => loading.classList.add('hidden'));
  </script>
</body>
</html>
