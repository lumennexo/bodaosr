<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BODAS OS · by LUMEN</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#192B38;background:#F5F2EC}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 17px;background:#192B38;color:white}button.secondary{background:#e5e2dc;color:#192B38}button:disabled{opacity:.5;cursor:wait}input,select,textarea{border:1px solid #d6d1c8;border-radius:9px;padding:11px;width:100%;background:white}label{display:block;font-size:13px;font-weight:650;margin:10px 0}label input,label select,label textarea{margin-top:5px}.brand{font-weight:800;letter-spacing:3px;font-size:23px}.brand small{display:block;font-size:10px;color:#B69A79;letter-spacing:4px;text-align:center}header{background:#192B38;color:#fff;padding:20px max(24px,calc((100vw - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}main{max-width:1150px;margin:35px auto;padding:0 20px}.login{max-width:440px;margin:12vh auto;background:white;padding:35px;border-radius:18px;box-shadow:0 15px 50px #192b3818;text-align:center}.login p{color:#647078}.login label{text-align:left}.muted{color:#66747c}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:1px solid #e7e3dd;border-radius:14px;padding:20px}.card strong{font-size:27px;display:block;margin-top:8px}.weddings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}.wedding{cursor:pointer;text-align:left;background:white;color:#192B38;border:1px solid #e4ddd3;min-height:135px}.wedding:hover{border-color:#B69A79}.wedding strong{display:block;font-size:19px;margin:9px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow-x:auto;margin:20px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#B69A79;color:#192B38}.tablewrap{overflow:auto;background:#fff;border-radius:13px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #eee;padding:12px}th{background:#f0ede8}.msg{padding:13px;margin:15px 0;border-radius:9px;background:#fff4e8;color:#7b3f16}.ok{background:#e6f2eb;color:#235c44}.form{background:white;padding:22px;border-radius:14px;max-width:670px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:5px 15px}.hide{display:none!important}h1{font-size:27px}h2{font-size:19px}#busy{position:fixed;right:15px;bottom:15px;background:#192B38;color:white;padding:12px;border-radius:9px;display:none}
</style></head><body><header><div class="brand">BODAS OS<small>BY LUMEN</small></div><div id="user"></div></header><main id="app"><div class="login"><h1>Entra con tu llave</h1><p>Cada detalle bajo control. Cada momento, extraordinario.</p><form id="login"><label>Llave de acceso<input id="key" autocomplete="off" required placeholder="XXXXX-XXXXX"></label><button>Entrar a BODAS OS</button></form><div id="notice"></div></div></main><div id="busy">Procesando…</div><script>
'use strict';
// CONFIGURACIÓN: reemplaza SOLO este valor con la URL pública del Worker.
const API_URL='PEGA_AQUI_URL_DEL_WORKER';
const app=document.getElementById('app'),user=document.getElementById('user'),busy=document.getElementById('busy');
let token=sessionStorage.getItem('bodas_token')||'', panel=null, boda=null, tab='resumen';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(n)||0);
const txt=(s)=>esc(s||'—');
function message(s,ok=false){let n=document.getElementById('notice');if(n)n.innerHTML=`<div class="msg ${ok?'ok':''}">${esc(s)}</div>`;else alert(s)}
async function call(accion,datos={}){if(!API_URL.startsWith('https://'))throw Error('Falta configurar API_URL en index.html');busy.style.display='block';try{let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion,datos,token})});let j=await r.json();if(!j.ok)throw Error(j.error||'Error de servidor');return j.datos;}finally{busy.style.display='none'}}
function logout(){sessionStorage.removeItem('bodas_token');location.reload()}
function head(name){user.innerHTML=`<span>${esc(name||'')}</span> <button class="secondary" id="logout">Salir</button>`;document.getElementById('logout').onclick=logout}
function loginView(){user.innerHTML='';app.innerHTML=`<div class="login"><h1>Entra con tu llave</h1><p>Cada detalle bajo control. Cada momento, extraordinario.</p><form id="login"><label>Llave de acceso<input id="key" required autocomplete="off" placeholder="XXXXX-XXXXX"></label><button>Entrar a BODAS OS</button></form><div id="notice"></div></div>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();token=document.getElementById('key').value.trim();try{await loadPanel();sessionStorage.setItem('bodas_token',token)}catch(err){token='';message(err.message)}}}
async function loadPanel(){panel=await call('panel');head(panel.sesion.nombre);if(panel.sesion.rol==='Novios'){message('Este acceso corresponde a novios; el panel completo requiere adaptar su vista de solo lectura.');return;}renderPanel()}
function renderPanel(){boda=null;let k=panel.kpis||{};app.innerHTML=`<div class="top"><div><h1>Escritorio</h1><p class="muted">${esc(panel.sesion.nombre)} · ${esc(panel.sesion.rol)}</p></div>${panel.sesion.edita?'<button id="new">+ Nueva boda</button>':''}</div><div class="cards"><div class="card">Bodas activas<strong>${k.activas||0}</strong></div><div class="card">Saldo pendiente<strong>${money(k.saldo_total)}</strong></div><div class="card">Alertas<strong>${k.alertas||0}</strong></div></div><div class="weddings">${(panel.bodas||[]).map(b=>`<button class="wedding" data-id="${esc(b.id_boda)}"><span class="muted">${esc(b.estatus)} · ${esc(b.fecha_larga)}</span><strong>${esc(b.novios)}</strong><span>${esc(b.venue||b.ciudad||'')} · ${esc(b.cuenta_corta)}</span></button>`).join('')||'<p>Todavía no hay bodas.</p>'}</div><div id="notice"></div>`;app.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openBoda(x.dataset.id));if(document.getElementById('new'))document.getElementById('new').onclick=()=>newBoda()}
function newBoda(){app.innerHTML=`<button class="secondary" id="back">← Escritorio</button><h1>Nueva boda</h1><form id="create" class="form"><div class="formgrid">${[['novios','Nombre de los novios','text'],['fecha_boda','Fecha','date'],['ciudad','Ciudad','text'],['venue','Lugar / venue','text'],['presupuesto_objetivo','Presupuesto objetivo','number'],['contacto_correo','Correo de contacto','email']].map(([n,t,type])=>`<label>${t}<input name="${n}" type="${type}" ${n==='novios'?'required':''}></label>`).join('')}</div><button>Guardar boda</button><div id="notice"></div></form>`;document.getElementById('back').onclick=renderPanel;document.getElementById('create').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let saved=await call('guardarBoda',d);await loadPanel();await openBoda(saved.id_boda)}catch(err){message(err.message)}}}
async function openBoda(id){try{boda=await call('boda',{id_boda:id});tab='resumen';renderBoda()}catch(err){message(err.message)}}
function table(rows,fields){if(!rows?.length)return '<p class="muted">No hay registros todavía.</p>';return `<div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${esc(f[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(f=>`<td>${txt(r[f[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderBoda(){let b=boda.boda||{};let tabs=['resumen','rubros','pagos','invitados','tareas','timeline','avances'];app.innerHTML=`<div class="top"><button class="secondary" id="back">← Escritorio</button><span>${esc(boda.sesion?.rol||'')}</span></div><h1>${esc(b.novios||boda.novios||'Expediente')}</h1><p class="muted">${esc(b.venue||'')} · ${esc(boda.cuenta||'')}</p><div class="tabs">${tabs.map(t=>`<button class="${tab===t?'active':'secondary'}" data-tab="${t}">${t==='timeline'?'Cronograma':t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}</div><section id="content"></section><div id="notice"></div>`;document.getElementById('back').onclick=async()=>{await loadPanel()};app.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;renderBoda()});let content=document.getElementById('content');if(tab==='resumen')content.innerHTML=`<div class="cards"><div class="card">Contratado<strong>${money(boda.totales?.contratado)}</strong></div><div class="card">Abonado<strong>${money(boda.totales?.abonado)}</strong></div><div class="card">Saldo<strong>${money(boda.totales?.saldo)}</strong></div></div><h2>Decisiones pendientes</h2>${table(boda.decisiones,[['categoria','Categoría'],['subcategoria','Concepto'],['proveedor','Proveedor']])}`;if(tab==='rubros')content.innerHTML=table(boda.rubros,[['categoria','Categoría'],['subcategoria','Concepto'],['proveedor','Proveedor'],['contratado','Contratado'],['saldo','Saldo'],['estatus','Estado']]);if(tab==='pagos')content.innerHTML=table(boda.pagos,[['fecha','Fecha'],['concepto','Concepto'],['monto','Monto'],['rubro','Rubro']]);if(tab==='invitados')content.innerHTML=table(boda.lista_invitados,[['nombre','Nombre'],['grupo','Grupo'],['adultos','Adultos'],['ninos','Niños'],['rsvp','RSVP'],['mesa','Mesa']]);if(tab==='tareas')content.innerHTML=table(boda.tareas,[['tarea','Tarea'],['responsable','Responsable'],['fecha_limite','Fecha límite'],['estatus','Estado']]);if(tab==='timeline')content.innerHTML=table(boda.timeline,[['hora','Hora'],['actividad','Actividad'],['responsable','Responsable'],['lugar','Lugar']]);if(tab==='avances')content.innerHTML=table(boda.avances,[['fecha','Fecha'],['asunto','Asunto'],['enviado_a','Destinatario']]);}
if(token)loadPanel().catch(()=>{token='';sessionStorage.removeItem('bodas_token');loginView();message('Vuelve a ingresar tu llave.');});else loginView();
</script></body></html>
